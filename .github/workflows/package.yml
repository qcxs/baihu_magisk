name: Package & Release

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      version:
        description: |
          版本号 (如 v1.2.3)。
          为空: 只打包并上传 artifact, 不发布 Release。
          非空: 更新 module 版本号, 创建对应 tag 并发布 GitHub Release。
        required: false
        type: string

jobs:
  build:
    name: Build module zip
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建 tag / 发布 Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: module versionCode is derived from the git commit count
          # (git rev-list --count HEAD), which a shallow clone (fetch-depth: 1)
          # would collapse to a constant 1.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      # --- Online build (standard, no bundled layers) ---
      - name: Build online package
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            python scripts/build.py --version "${{ inputs.version }}"
          else
            python scripts/build.py
          fi

      # --- Offline bundle (includes arm64 OCI layers) ---
      # Reuses the already-built webroot from the online step (--module-only).
      # --module-only skips webui rebuild and version reset, keeping whatever
      # the online step wrote into module.prop.
      - name: Build offline bundle
        run: python scripts/build.py --module-only --offline-bundle
        continue-on-error: true   # 离线层下载失败不阻断在线版发布

      - name: List dist/
        run: ls -lh dist/

      # --- Upload both zips as artifacts (no-release builds) ---
      - name: Upload zips (no release)
        if: ${{ inputs.version == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: baihu_qcxs-module
          path: |
            dist/baihu_qcxs.zip
            dist/baihu_qcxs_offline.zip
          if-no-files-found: error

      # --- Release steps (version non-empty) ---
      - name: Show release file info
        if: ${{ inputs.version != '' }}
        run: ls -lh dist/

      - name: Create or update tag
        if: ${{ inputs.version != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f 允许重复发布同版本号时强制覆盖已有 tag
          git tag -f "${{ inputs.version }}"
          git push origin --force "${{ inputs.version }}"

      - name: Create or update GitHub Release
        if: ${{ inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body: |
            Baihu Panel (白虎面板) 模块发布。

            版本: `${{ inputs.version }}`
            - WebUI: Vue 3 + Vite
            - 支持 Magisk / KernelSU / APatch
            - KernelSU 需安装 Hybrid Mount 元模块

            ### 下载说明
            - **`baihu_qcxs.zip`** — 在线安装版 (较小, 安装时需联网下载镜像)
            - **`baihu_qcxs_offline.zip`** — 内置镜像版 (较大, 安装无需联网, 仅 arm64)
          draft: false
          prerelease: false
          update: true    # 同 tag 已存在 Release 时自动覆盖
          files: |
            dist/baihu_qcxs.zip
            dist/baihu_qcxs_offline.zip